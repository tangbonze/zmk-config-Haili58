# User Configuration for ${keyboard.name}
#
# Loaded for BOTH halves (ZMK appends every matching `config/<name>.conf`,
# so haili58_left.conf / haili58_right.conf layer on top of this file).
#
# Anything that talks to DYA Studio lives in haili58_left.conf, because ZMK
# only brings up ZMK_STUDIO_RPC on the split central.

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation Behaviors
CONFIG_ZMK_POINTING=y

# Soft Off Behavior
CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_DISPLAY=y

# Zephyr 4.1 turns CONFIG_CONSOLE on by default; nothing here needs it and the
# RAM is better spent on Studio RPC buffers.
CONFIG_CONSOLE=n

# ---------------------------------------------------------------------------
# DYA Studio — halves shared plumbing
# ---------------------------------------------------------------------------
# ZMK_SPLIT_RELAY_EVENT lets the central half relay DYA Studio requests down
# to the peripheral, which is what makes the Connection / Settings /
# Diagnostics tabs see (and configure) both halves.
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y

# Feature modules (their *_STUDIO_RPC counterparts are in haili58_left.conf)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_WATCHDOG=y

# ---------------------------------------------------------------------------
# Stack / buffer sizing
# ---------------------------------------------------------------------------
# Recommended values from the DYA Studio developer guide. Several Custom
# Studio Protocol modules at once is stack hungry on an nRF52840; if a build
# comes up short, halve these one at a time and test on hardware.
# https://studio.dya.cormoran.works/developer-guide/level-2

# Persist settings sooner so nothing is lost right after an edit. Costs more
# flash writes.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
