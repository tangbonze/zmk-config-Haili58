# User Configuration for ${keyboard.name}
#
# Loaded for BOTH halves (ZMK appends every matching `config/<name>.conf`,
# so haili58_left.conf / haili58_right.conf layer on top of this file).
#
# Anything that talks to DYA Studio lives in haili58_left.conf, because ZMK
# only brings up ZMK_STUDIO_RPC on the split central.

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation Behaviors
CONFIG_ZMK_POINTING=y

# ---------------------------------------------------------------------------
# Power management
# ---------------------------------------------------------------------------
# Soft Off Behavior: "turn the keyboard off now" from a keymap binding.
# Nothing binds &soft_off in config/haili58.keymap, so the node is dropped
# everywhere it is not explicitly kept: the two left/Studio artifacts pass
# -DZMK_BEHAVIORS_KEEP_ALL (see the studio-rpc-usb-uart snippet) and still
# contain it, while haili58_right does not. Adding the binding to the keymap is
# what makes it exist on both halves -- which `split-peripheral-off-on-press`
# needs, since that is the flag that powers the right half down too.
#
# There is also no zmk,soft-off-wakeup-sources node, so after a soft off the
# reset button is the only way back (the `wakeup-source` on kscan only covers
# deep sleep).
CONFIG_ZMK_PM_SOFT_OFF=y

# Deep sleep: automatic power-off after CONFIG_ZMK_IDLE_SLEEP_TIMEOUT of no
# activity. ZMK's ZMK_SLEEP symbol has no default, so without this line the
# keyboard never sleeps (app/src/activity.c compiles the sys_poweroff() branch
# out entirely).
#
# Needed by DYA Studio as well: the Settings tab's "Power Management" panel is
# shown whenever zmk-module-settings-rpc is compiled in, but it submits
# idle_ms and sleep_ms in one request and drops the whole thing when either
# fails. zmk_activity_set_sleep_ms() returns false unconditionally while
# CONFIG_ZMK_SLEEP is off, so every apply/reset from that panel fails with
# "Failed to update activity settings" -- and, because of the `if (success)`
# gate in the handler, the idle change is not relayed to the right half either.
#
# The other power symbols this pulls in (POWEROFF, PM_DEVICE,
# ZMK_PM_DEVICE_SUSPEND_RESUME) are already selected by ZMK_PM_SOFT_OFF above,
# so the cost is essentially zero.
#
# Both halves sleep, each on its own idle timer, and each key press only wakes
# the half it happened on -- ZMK has no cross-half wake-up. In practice you
# wake the keyboard by pressing a key on the left/central half. Sleeping is
# skipped while USB is attached (!is_usb_power_present()), and both kscan nodes
# already carry `wakeup-source`, which deep sleep requires.
#
# IDLE_SLEEP_TIMEOUT is only the firmware default / starting value; DYA Studio
# writes a different one into settings and it survives reboots. The DYA
# "reset to defaults" button sets 30 s idle / 15 min sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_DISPLAY=y

# Zephyr 4.1 turns CONFIG_CONSOLE on by default; nothing here needs it and the
# RAM is better spent on Studio RPC buffers.
CONFIG_CONSOLE=n

# ---------------------------------------------------------------------------
# DYA Studio — halves shared plumbing
# ---------------------------------------------------------------------------
# ZMK_SPLIT_RELAY_EVENT lets the central half relay DYA Studio requests down
# to the peripheral, which is what makes the Connection / Settings /
# Diagnostics tabs see (and configure) both halves.
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y

# Feature modules (their *_STUDIO_RPC counterparts are in haili58_left.conf)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_WATCHDOG=y

# ---------------------------------------------------------------------------
# Stack / buffer sizing
# ---------------------------------------------------------------------------
# Recommended values from the DYA Studio developer guide. Several Custom
# Studio Protocol modules at once is stack hungry on an nRF52840; if a build
# comes up short, halve these one at a time and test on hardware.
# https://studio.dya.cormoran.works/developer-guide/level-2

# Persist settings sooner so nothing is lost right after an edit. Costs more
# flash writes.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
