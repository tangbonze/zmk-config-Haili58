# Central (left) half only.
#
# ZMK selects ZMK_STUDIO_RPC only for the split central, so every
# *_STUDIO_RPC flag has to live here — on the peripheral those symbols are
# unreachable and the Studio UI would advertise features the right half
# cannot serve.
#
# CONFIG_ZMK_STUDIO=y is passed from build.yaml (-DCONFIG_ZMK_STUDIO=y) next
# to the `studio-rpc-usb-uart` snippet, so the wiring stays visible in the
# build matrix.

CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y

# Runtime macros and combos are central-only: they hook ZMK's behavior queue,
# keymap and keycode event listener, which ZMK compiles into the split central
# image only. Enabling them on the peripheral fails to link with undefined
# references to zmk_behavior_queue_add / zmk_keymap_highest_layer_active.
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# Behavior local IDs must be the short CRC16 flavour: the Studio RPC payloads
# that carry macro/combo bindings are sized against it.
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# ---------------------------------------------------------------------------
# Runtime sensor rotate (the two EC11 knobs)
# ---------------------------------------------------------------------------
# Per-layer encoder bindings, edited from DYA Studio's keymap view (click a
# knob -> "Rotary Encoder Configuration") and persisted in settings. The
# per-layer defaults still come from the keymap.
#
# Central-only, for the same reason as runtime macros/combos: the behavior
# pushes key events through zmk_behavior_queue_add(), and ZMK only compiles
# src/behavior_queue.c (together with keymap.c) into the central image. Turning
# it on for the right half fails to link with
# `undefined reference to zmk_behavior_queue_add`.
#
# The peripheral half keeps working unmodified: app/src/sensors.c is built on
# both halves, so the right knob raises a sensor event locally, the split link
# forwards it, and the central re-raises it into its own keymap. That is why
# the right knob is configured from this file too.
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# Required by the module, and easy to miss. It turns a binding saved by the
# Studio tab back into a behavior by calling
# zmk_behavior_find_behavior_name_from_local_id(), and that whole path sits
# behind `#if IS_ENABLED(CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS)` in
# behavior_runtime_sensor_rotate.c.
#
# ZMK does NOT select this symbol for the CRC16 local-ID flavour above — only
# ZMK_BEHAVIOR_LOCAL_ID_TYPE_SETTINGS_TABLE does (see app/Kconfig.behaviors),
# and ZMK_STUDIO_RPC only selects ZMK_BEHAVIOR_LOCAL_IDS. Without this line the
# tab reads and writes happily, the firmware stores everything, and rotating
# the knob does nothing but log "Failed to find behavior for local_id N".
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y

# ---------------------------------------------------------------------------
# Studio RPC buffers / stacks (central only)
# ---------------------------------------------------------------------------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
