# Central (left) half only.
#
# ZMK selects ZMK_STUDIO_RPC only for the split central, so every
# *_STUDIO_RPC flag has to live here — on the peripheral those symbols are
# unreachable and the Studio UI would advertise features the right half
# cannot serve.
#
# CONFIG_ZMK_STUDIO=y is passed from build.yaml (-DCONFIG_ZMK_STUDIO=y) next
# to the `studio-rpc-usb-uart` snippet, so the wiring stays visible in the
# build matrix.

CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y

# Runtime macros and combos are central-only: they hook ZMK's behavior queue,
# keymap and keycode event listener, which ZMK compiles into the split central
# image only. Enabling them on the peripheral fails to link with undefined
# references to zmk_behavior_queue_add / zmk_keymap_highest_layer_active.
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# Behavior local IDs must be the short CRC16 flavour: the Studio RPC payloads
# that carry macro/combo bindings are sized against it.
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# ---------------------------------------------------------------------------
# Studio RPC buffers / stacks (central only)
# ---------------------------------------------------------------------------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
